<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ReelTruth - AI Influencer Product Evaluator</title>
    <meta name="description" content="AI-powered product verification analyzer for Instagram Reels influencer promotions. Check claims against real user reviews.">
    
    <!-- PWA configuration -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#070510">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cyberBg: '#070510',
                        cyberDark: '#0c091c',
                        cyberMatte: '#100e21',
                        borderGlass: '#2c2456',
                        cyberPurple: '#9e00ff',
                        cyberBlue: '#00c2ff',
                        softText: '#c0bacf',
                        starGold: '#ffb800',
                        redAlert: '#ff0d5c',
                        greenVerified: '#0dff92'
                    },
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                        mono: ['Space Grotesk', 'monospace']
                    }
                }
            }
        }
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- React and Babel for single-file compilation -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>

    <style>
        body {
            background-color: #070510;
            color: #ffffff;
            font-family: 'Outfit', sans-serif;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(158, 0, 255, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(0, 194, 255, 0.08) 0%, transparent 40%);
            background-attachment: fixed;
            -webkit-tap-highlight-color: transparent;
        }
        
        .glass-panel {
            background: rgba(16, 14, 33, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(44, 36, 86, 0.5);
        }

        .neon-shadow-purple {
            box-shadow: 0 0 15px rgba(158, 0, 255, 0.25);
        }

        .neon-shadow-blue {
            box-shadow: 0 0 15px rgba(0, 194, 255, 0.25);
        }
        
        /* Hide scrollbars but keep functionality */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        @keyframes pulse-border {
            0%, 100% { border-color: rgba(158, 0, 255, 0.4); }
            50% { border-color: rgba(0, 194, 255, 0.8); }
        }

        .pulsing-border {
            animation: pulse-border 3s infinite;
        }
    </style>
</head>
<body class="safe-top safe-bottom">

    <div id="root"></div>

    <!-- React App Implementation -->
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function App() {
            // Pipeline & report states
            const [reports, setReports] = useState([]);
            const [currentState, setCurrentState] = useState({ status: 'Idle', logs: ['System Initialized.'] });
            const [activeReportUrl, setActiveReportUrl] = useState(null);
            
            // Local form states
            const [urlInput, setUrlInput] = useState('');
            const [screenshotBase64, setScreenshotBase64] = useState(null);
            const [activeTab, setActiveTab] = useState('new'); // 'new' or 'history'
            const [isAndroid, setIsAndroid] = useState(false);
            const [installPrompt, setInstallPrompt] = useState(null);

            // Browser simulation states
            const [simulatedLogs, setSimulatedLogs] = useState([]);
            const [isSimulating, setIsSimulating] = useState(false);

            // Ref for file upload
            const fileInputRef = useRef(null);

            // Check if running on Android WebView with our interface
            useEffect(() => {
                const androidPresent = !!(window.ReelTruthAndroid && window.ReelTruthAndroid.getStateJson);
                setIsAndroid(androidPresent);
                
                // Load reports
                loadStoredReports(androidPresent);

                // Start polling state if android is present
                let interval;
                if (androidPresent) {
                    interval = setInterval(() => {
                        const state = getAndroidState();
                        if (state) {
                            setCurrentState(state);
                            // If completed, reload reports and show details
                            if (state.status === 'Completed' && state.report) {
                                let repObj = state.report;
                                if (typeof repObj === 'string') {
                                    try { repObj = JSON.parse(repObj); } catch(e) {}
                                }
                                setActiveReportUrl(repObj.reelUrl || repObj.id);
                                loadStoredReports(true);
                            }
                        }
                    }, 800);
                }
                return () => clearInterval(interval);
            }, []);

            // PWA Install prompt interceptor
            useEffect(() => {
                window.addEventListener('beforeinstallprompt', (e) => {
                    e.preventDefault();
                    setInstallPrompt(e);
                });
            }, []);

            const loadStoredReports = (androidMode) => {
                if (androidMode && window.ReelTruthAndroid.getReportsJson) {
                    try {
                        const repsStr = window.ReelTruthAndroid.getReportsJson();
                        const parsed = JSON.parse(repsStr);
                        setReports(parsed || []);
                    } catch (e) {
                        console.error("Error loading reports:", e);
                    }
                } else {
                    const local = localStorage.getItem('reeltruth_reports');
                    if (local) {
                        try { setReports(JSON.parse(local)); } catch(e){}
                    } else {
                        // Populate clean sample reports for premium showcase if browser standalone
                        const mockList = getMockReports();
                        localStorage.setItem('reeltruth_reports', JSON.stringify(mockList));
                        setReports(mockList);
                    }
                }
            };

            const triggerInstall = () => {
                if (installPrompt) {
                    installPrompt.prompt();
                    installPrompt.userChoice.then((choiceResult) => {
                        if (choiceResult.outcome === 'accepted') {
                            setInstallPrompt(null);
                        }
                    });
                } else {
                    alert("To install, tap the Share or Browser Options menu and select 'Add to Home Screen'!");
                }
            };

            const getAndroidState = () => {
                if (window.ReelTruthAndroid && window.ReelTruthAndroid.getStateJson) {
                    try {
                        const str = window.ReelTruthAndroid.getStateJson();
                        return JSON.parse(str);
                    } catch (e) {
                        console.error("Android state error:", e);
                    }
                }
                return null;
            };

            // Convert file to base64
            const handleScreenshotChange = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onloadend = () => {
                    setScreenshotBase64(reader.result);
                };
                reader.readAsDataURL(file);
            };

            const handleAnalyze = () => {
                if (!urlInput.trim()) {
                    alert("Please enter a valid Instagram Reel URL.");
                    return;
                }

                if (isAndroid) {
                    // Start actual secure Kotlin network/Gemini pipeline
                    window.ReelTruthAndroid.startAnalysis(urlInput, screenshotBase64);
                } else {
                    // Browser Emulation mode
                    startBrowserSimulation(urlInput, screenshotBase64);
                }
            };

            // Standalone Browser Simulation (Full fidelity mock pipeline)
            const startBrowserSimulation = (url, imageBase64) => {
                setIsSimulating(true);
                setSimulatedLogs(["[INFO] Initializing standalone browser pipeline..."]);
                setCurrentState({ status: 'ExtractingMetadata', logs: ["System check passed."] });

                const stages = [
                    { status: 'ExtractingMetadata', log: "Bypassing scraper restrictions... Fetching video tags.", delay: 1000 },
                    { status: 'ExtractingMetadata', log: imageBase64 ? "Fallback active: Running Gemini Vision on attached screenshot..." : "No image attached. Reading Reel text annotations.", delay: 1800 },
                    { status: 'DetectingProduct', log: "Analyzing layout signatures... Product pattern detected.", delay: 1200 },
                    { status: 'AnalyzingReviews', log: "Executing real YouTube reviews sentiment query...", delay: 1500 },
                    { status: 'Completed', log: "Success! Trust & Reality matrix calculated. Local Cache Saved.", delay: 1200 }
                ];

                let currentStage = 0;
                const runNextStage = () => {
                    if (currentStage >= stages.length) {
                        // Finish simulation and create dynamic report based on URL
                        const finalReport = createSimulatedReport(url, imageBase64);
                        
                        const updatedReports = [finalReport, ...reports.filter(r => r.reelUrl !== url)];
                        setReports(updatedReports);
                        localStorage.setItem('reeltruth_reports', JSON.stringify(updatedReports));

                        setCurrentState({
                            status: 'Completed',
                            report: finalReport,
                            pineconeMsg: "Local Web Database OK"
                        });
                        setActiveReportUrl(finalReport.id);
                        setIsSimulating(false);
                        return;
                    }

                    const stage = stages[currentStage];
                    setSimulatedLogs(prev => [...prev, `[INFO] ${stage.log}`]);
                    setCurrentState(prev => ({
                        status: stage.status,
                        logs: [...(prev.logs || []), `[INFO] ${stage.log}`]
                    }));

                    currentStage++;
                    setTimeout(runNextStage, stage.delay);
                };

                setTimeout(runNextStage, 500);
            };

            const handleDeleteReport = (id) => {
                if (confirm("Are you sure you want to delete this report?")) {
                    if (isAndroid) {
                        window.ReelTruthAndroid.deleteReport(id);
                        setTimeout(() => loadStoredReports(true), 500);
                    } else {
                        const updated = reports.filter(r => r.id !== id);
                        setReports(updated);
                        localStorage.setItem('reeltruth_reports', JSON.stringify(updated));
                    }
                    if (activeReportUrl === id) {
                        setActiveReportUrl(null);
                    }
                }
            };

            const handleProductConfirm = (pName, brand, model) => {
                if (isAndroid) {
                    const origMeta = currentState.originalMetadata;
                    window.ReelTruthAndroid.confirmProduct(pName, brand, model, JSON.stringify(origMeta), urlInput);
                } else {
                    // Standalone confirmation
                    setSimulatedLogs(prev => [...prev, "[INFO] Product details confirmed. Running review aggregator..."]);
                    setCurrentState({ status: 'AnalyzingReviews', logs: ["Analysis in progress."] });
                    setTimeout(() => {
                        const final = createSimulatedReport(urlInput, screenshotBase64, pName, brand, model);
                        const updated = [final, ...reports.filter(r => r.reelUrl !== urlInput)];
                        setReports(updated);
                        localStorage.setItem('reeltruth_reports', JSON.stringify(updated));
                        setCurrentState({ status: 'Completed', report: final });
                        setActiveReportUrl(final.id);
                    }, 1500);
                }
            };

            const resetAnalysis = () => {
                setUrlInput('');
                setScreenshotBase64(null);
                if (isAndroid) {
                    window.ReelTruthAndroid.resetToIdle();
                } else {
                    setCurrentState({ status: 'Idle', logs: [] });
                }
            };

            // Get selected report
            const selectedReport = reports.find(r => r.id === activeReportUrl || r.reelUrl === activeReportUrl);

            // Rendering subcomponents
            return (
                <div class="min-h-screen pb-12 flex flex-col max-w-md mx-auto relative px-4">
                    {/* Header */}
                    <header class="pt-6 pb-4 flex justify-between items-center border-b border-white/5">
                        <div class="flex items-center space-x-2">
                            <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-cyberPurple to-cyberBlue flex items-center justify-center font-black text-white text-base neon-shadow-blue">RT</div>
                            <div>
                                <h1 class="text-lg font-black tracking-tight bg-gradient-to-r from-white to-softText bg-clip-text text-transparent">ReelTruth</h1>
                                <p class="text-[10px] font-mono text-cyan-400 uppercase tracking-widest">Mobile-First PWA</p>
                            </div>
                        </div>

                        {installPrompt && (
                            <button onClick={triggerInstall} class="flex items-center space-x-1 py-1.5 px-3 rounded-full bg-cyberBlue/10 hover:bg-cyberBlue/20 border border-cyberBlue/30 transition duration-200">
                                <i data-lucide="download" class="w-3.5 h-3.5 text-cyberBlue"></i>
                                <span class="text-xs font-bold text-cyberBlue">Install</span>
                            </button>
                        )}
                    </header>

                    {/* Navigation tabs */}
                    <div class="flex mt-4 p-1 rounded-lg bg-cyberDark/50 border border-white/5">
                        <button 
                            onClick={() => { setActiveTab('new'); setActiveReportUrl(null); }} 
                            class={`flex-1 py-2 rounded-md font-bold text-xs transition duration-300 flex items-center justify-center space-x-2 ${activeTab === 'new' ? 'bg-cyberPurple/20 text-white border border-cyberPurple/40 font-black' : 'text-softText hover:text-white'}`}
                        >
                            <i data-lucide="scan-line" class="w-4 h-4"></i>
                            <span>New Scanner</span>
                        </button>
                        <button 
                            onClick={() => setActiveTab('history')} 
                            class={`flex-1 py-2 rounded-md font-bold text-xs transition duration-300 flex items-center justify-center space-x-2 ${activeTab === 'history' ? 'bg-cyberPurple/20 text-white border border-cyberPurple/40 font-black' : 'text-softText hover:text-white'}`}
                        >
                            <i data-lucide="history" class="w-4 h-4"></i>
                            <span>Analysis History</span>
                            {reports.length > 0 && (
                                <span class="ml-1 bg-cyberPurple text-white px-1.5 py-0.5 rounded-full text-[9px] font-black">{reports.length}</span>
                            )}
                        </button>
                    </div>

                    {/* Content Section */}
                    <main class="flex-1 mt-4">
                        {activeReportUrl && selectedReport ? (
                            <ReportView 
                                report={selectedReport} 
                                onBack={() => { setActiveReportUrl(null); resetAnalysis(); }}
                                onDelete={() => handleDeleteReport(selectedReport.id)}
                            />
                        ) : activeTab === 'new' ? (
                            <ScannerForm 
                                urlInput={urlInput}
                                setUrlInput={setUrlInput}
                                screenshotBase64={screenshotBase64}
                                setScreenshotBase64={setScreenshotBase64}
                                fileInputRef={fileInputRef}
                                handleScreenshotChange={handleScreenshotChange}
                                handleAnalyze={handleAnalyze}
                                currentState={currentState}
                                isAndroid={isAndroid}
                                onReset={resetAnalysis}
                                onConfirm={handleProductConfirm}
                            />
                        ) : (
                            <ReportsHistory 
                                reports={reports} 
                                onSelect={(rep) => { setActiveReportUrl(rep.id || rep.reelUrl); }}
                                onDelete={handleDeleteReport}
                            />
                        )}
                    </main>

                    {/* Bottom Status / Mode bar */}
                    <footer class="mt-8 pt-4 border-t border-white/5 flex flex-col items-center space-y-2 text-center text-[11px] text-softText/60">
                        <div class="flex items-center space-x-1.5">
                            <span class={`w-2 h-2 rounded-full ${isAndroid ? 'bg-greenVerified animate-pulse' : 'bg-amber-400 animate-pulse'}`}></span>
                            <span class="font-mono text-[10px]">
                                {isAndroid ? "Connected to Secure Local Kotlin Pipeline (Pinecone-free)" : "Browser Demo Mode (100% Client-Side Fallback)"}
                            </span>
                        </div>
                        <p class="font-mono text-[9px]">ReelTruth Evaluating Engine © 2026</p>
                    </footer>
                </div>
            );
        }

        // --- SCANNER FORM COMPONENT ---
        function ScannerForm({ urlInput, setUrlInput, screenshotBase64, setScreenshotBase64, fileInputRef, handleScreenshotChange, handleAnalyze, currentState, isAndroid, onReset, onConfirm }) {
            useEffect(() => {
                lucide.createIcons();
            }, [currentState, screenshotBase64]);

            // If system is doing something, show pipeline progress logs
            if (currentState.status !== 'Idle') {
                return (
                    <div class="glass-panel rounded-2xl p-5 border border-white/10 flex flex-col space-y-6">
                        <div class="flex flex-col items-center justify-center text-center py-6">
                            {/* Loading Animation */}
                            {currentState.status !== 'Error' && currentState.status !== 'ProductConfirmation' ? (
                                <div class="relative w-20 h-20 flex items-center justify-center">
                                    <div class="absolute inset-0 rounded-full border-4 border-cyberPurple/20 border-t-cyberPurple animate-spin"></div>
                                    <div class="absolute inset-2 rounded-full border-4 border-cyberBlue/15 border-b-cyberBlue animate-spin animate-duration-1000"></div>
                                    <i data-lucide="shield-alert" class="w-8 h-8 text-cyan-400"></i>
                                </div>
                            ) : currentState.status === 'Error' ? (
                                <div class="w-16 h-16 rounded-full bg-redAlert/10 border border-redAlert/30 flex items-center justify-center text-redAlert animate-bounce">
                                    <i data-lucide="alert-triangle" class="w-8 h-8"></i>
                                </div>
                            ) : null}

                            <h3 class="text-base font-black mt-4">
                                {currentState.status === 'ExtractingMetadata' && "Extracting Reel Content..."}
                                {currentState.status === 'DetectingProduct' && "Identifying Product brand..."}
                                {currentState.status === 'AnalyzingReviews' && "Analyzing YouTube & Reviews..."}
                                {currentState.status === 'ProductConfirmation' && "Confirm Detected Product"}
                                {currentState.status === 'Error' && "Pipeline Encountered An Issue"}
                            </h3>
                            <p class="text-xs text-softText mt-1">
                                {currentState.status !== 'Error' && "Evaluating marketing assertions via Gemini..."}
                            </p>
                        </div>

                        {/* Product Confirmation Drawer/Gating */}
                        {currentState.status === 'ProductConfirmation' && (
                            <div class="bg-cyberDark/80 border border-white/5 p-4 rounded-xl space-y-4">
                                <div class="flex items-start space-x-3">
                                    <div class="w-8 h-8 rounded bg-cyan-400/10 flex items-center justify-center text-cyan-400">
                                        <i data-lucide="cpu" class="w-4 h-4"></i>
                                    </div>
                                    <div>
                                        <h4 class="text-xs font-bold text-cyan-400 uppercase tracking-wider">AI Detection Confidence Low</h4>
                                        <p class="text-[11px] text-softText">Verify the exact product to compile high accuracy YouTube assessments.</p>
                                    </div>
                                </div>

                                <div class="space-y-3 pt-2">
                                    <div>
                                        <label class="text-[10px] font-mono uppercase tracking-wider text-softText/60">Brand</label>
                                        <input 
                                            type="text" 
                                            id="confirmBrand" 
                                            defaultValue={currentState.brand || ''} 
                                            class="w-full bg-cyberBg border border-white/10 rounded-lg py-2 px-3 text-xs focus:border-cyberPurple outline-none" 
                                        />
                                    </div>
                                    <div>
                                        <label class="text-[10px] font-mono uppercase tracking-wider text-softText/60">Product Name</label>
                                        <input 
                                            type="text" 
                                            id="confirmProductName" 
                                            defaultValue={currentState.productName || ''} 
                                            class="w-full bg-cyberBg border border-white/10 rounded-lg py-2 px-3 text-xs focus:border-cyberPurple outline-none" 
                                        />
                                    </div>
                                    <div>
                                        <label class="text-[10px] font-mono uppercase tracking-wider text-softText/60">Model (Optional)</label>
                                        <input 
                                            type="text" 
                                            id="confirmModel" 
                                            defaultValue={currentState.modelNumber || ''} 
                                            class="w-full bg-cyberBg border border-white/10 rounded-lg py-2 px-3 text-xs focus:border-cyberPurple outline-none" 
                                        />
                                    </div>
                                </div>

                                <button 
                                    onClick={() => {
                                        const b = document.getElementById('confirmBrand').value;
                                        const p = document.getElementById('confirmProductName').value;
                                        const m = document.getElementById('confirmModel').value;
                                        onConfirm(p, b, m);
                                    }}
                                    class="w-full py-2.5 bg-gradient-to-r from-cyberPurple to-cyberBlue text-white rounded-lg text-xs font-bold shadow-lg hover:brightness-110 transition duration-300"
                                >
                                    Confirm Details & Proceed Analysis
                                </button>
                            </div>
                        )}

                        {/* Log viewer terminal */}
                        <div class="bg-black/40 border border-white/5 rounded-xl p-3 font-mono text-[10px] text-softText max-h-48 overflow-y-auto no-scrollbar space-y-1">
                            <div class="text-cyan-400/80 mb-1 flex items-center justify-between border-b border-white/5 pb-1">
                                <span>PIPELINE ANALYTICAL TERMINAL</span>
                                <span class="animate-pulse">● ACTIVE</span>
                            </div>
                            {(currentState.logs || []).map((log, index) => (
                                <div key={index} class="leading-relaxed">
                                    <span class="text-cyberPurple/80">&gt;</span> {log}
                                </div>
                            ))}
                        </div>

                        {currentState.status === 'Error' && (
                            <div class="flex space-x-3">
                                <button onClick={onReset} class="flex-1 py-2.5 bg-white/5 border border-white/10 hover:bg-white/10 rounded-xl text-xs font-bold transition duration-300">
                                    Clear & Restart
                                </button>
                            </div>
                        )}
                    </div>
                );
            }

            return (
                <div class="flex flex-col space-y-4">
                    {/* Welcome Banner */}
                    <div class="glass-panel p-5 rounded-2xl relative overflow-hidden flex flex-col space-y-2 border border-white/10">
                        <div class="w-12 h-12 rounded-full bg-cyberPurple/20 flex items-center justify-center text-cyberPurple neon-shadow-purple mb-1">
                            <i data-lucide="shield-check" class="w-6 h-6"></i>
                        </div>
                        <h2 class="text-base font-black tracking-tight">Influent Hype. Verified Real.</h2>
                        <p class="text-xs text-softText leading-relaxed">
                            Evaluate Instagram Reels sales claims instantly. ReelTruth identifies products, OCR overlays, performs Gemini verification, and searches consumer critiques in bulk.
                        </p>
                    </div>

                    {/* Interactive Input Form */}
                    <div class="glass-panel p-5 rounded-2xl flex flex-col space-y-4 border border-white/10">
                        <div>
                            <label class="text-[11px] font-mono tracking-widest uppercase text-softText/80 block mb-2">Reel Link</label>
                            <div class="relative">
                                <i data-lucide="instagram" class="absolute left-3.5 top-3.5 w-4 font-black h-4 text-pink-500"></i>
                                <input 
                                    type="text" 
                                    value={urlInput}
                                    onChange={(e) => setUrlInput(e.target.value)}
                                    placeholder="Paste Instagram Reel Link..."
                                    class="w-full bg-cyberBg border border-white/10 rounded-xl py-3 pl-10 pr-4 text-xs font-medium text-white focus:outline-none focus:border-cyberPurple/80 focus:ring-1 focus:ring-cyberPurple/40 transition duration-300"
                                />
                            </div>
                        </div>

                        {/* Optional Screenshot Upload Section */}
                        <div class="pt-2">
                            <div class="flex items-center justify-between mb-2">
                                <label class="text-[11px] font-mono tracking-widest uppercase text-softText/80 flex items-center space-x-1">
                                    <i data-lucide="camera" class="w-3.5 h-3.5 text-cyberBlue"></i>
                                    <span>Reel Screenshot</span>
                                </label>
                                <span class="bg-cyberBlue/10 text-cyberBlue text-[9px] font-black px-1.5 py-0.5 rounded-md tracking-wider">HIGHLY RECOMMENDED</span>
                            </div>

                            {screenshotBase64 ? (
                                <div class="bg-black/30 border border-white/10 rounded-xl p-2.5 flex items-center justify-between">
                                    <div class="flex items-center space-x-3">
                                        <img src={screenshotBase64} alt="Reel screenshot thumbnail" class="w-12 h-12 object-cover rounded-lg border border-white/10" />
                                        <div>
                                            <p class="text-xs font-bold text-greenVerified">Screenshot Attached</p>
                                            <p class="text-[10px] text-softText/70">Ready for OCR Vision Pipeline</p>
                                        </div>
                                    </div>
                                    <button 
                                        onClick={() => setScreenshotBase64(null)}
                                        class="p-2 bg-redAlert/10 hover:bg-redAlert/20 rounded-lg text-redAlert transition duration-200"
                                    >
                                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                                    </button>
                                </div>
                            ) : (
                                <button 
                                    onClick={() => fileInputRef.current.click()}

                        { store: "Amazon.in", price: "₹349", url: "https://amazon.in", isCheapest: true },
                        { store: "Croma Store", price: "₹379", url: "https://croma.com", isCheapest: false }
                    ],
                    timestamp: Date.now() - 7200000
                }
            ];
        }

        // Service Worker registration for robust offline mobile-first installations
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('service-worker.js')
                    .then(reg => console.log('ReelTruth Service Worker configured successfully.', reg.scope))
                    .catch(err => console.error('Service Worker registration failed:', err));
            });
        }

        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>
</html>
